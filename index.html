<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drini Travel - Gjenerator Emailesh</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f2f5;color:#333;height:100vh;overflow:hidden}

.app-header{background:linear-gradient(135deg,#003D6B 0%,#0099CC 100%);color:#fff;padding:10px 20px;display:flex;align-items:center;justify-content:space-between;height:54px;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.app-header-left{display:flex;align-items:center;gap:10px}
.app-title{font-size:16px;font-weight:700}
.app-subtitle{font-size:11px;opacity:.75}
.app-badge{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);padding:3px 12px;border-radius:20px;font-size:11px;font-weight:600}

.main-layout{display:grid;grid-template-columns:1fr 1fr;height:calc(100vh - 54px)}

.form-panel{background:#fff;overflow-y:auto;border-right:2px solid #dde;display:flex;flex-direction:column}
.form-body{flex:1}

.section{padding:13px 15px;border-bottom:1px solid #eee}
.section-title{font-size:12px;font-weight:700;color:#003D6B;margin-bottom:10px;display:flex;align-items:center;gap:5px;text-transform:uppercase;letter-spacing:.4px}

.form-group{margin-bottom:8px}
label{display:block;font-size:11px;font-weight:700;color:#555;margin-bottom:3px;text-transform:uppercase;letter-spacing:.3px}
input[type=text],input[type=email],input[type=date],textarea{width:100%;padding:6px 9px;border:1.5px solid #ddd;border-radius:6px;font-size:12px;font-family:inherit;background:#fafafa;color:#333;transition:border-color .2s,box-shadow .2s}
input[type=text]:focus,input[type=email]:focus,input[type=date]:focus,textarea:focus,select:focus{outline:none;border-color:#0099CC;background:#fff;box-shadow:0 0 0 3px rgba(0,153,204,.12)}
select{width:100%;padding:6px 9px;border:1.5px solid #ddd;border-radius:6px;font-size:12px;font-family:inherit;background:#fafafa;color:#333;cursor:pointer;transition:border-color .2s}
input[type=date]{cursor:pointer}
textarea{resize:vertical;min-height:52px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:4px;padding:7px 12px;border:none;border-radius:6px;cursor:pointer;font-size:12px;font-weight:600;font-family:inherit;transition:all .18s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn-primary{background:#0099CC;color:#fff}
.btn-primary:hover{background:#007aa3}
.btn-danger{background:#e53935;color:#fff;padding:4px 9px;font-size:11px;border-radius:5px}
.btn-danger:hover{background:#c62828}
.btn-success{background:#25D366;color:#fff}
.btn-success:hover{background:#1da851}
.btn-dark{background:#003D6B;color:#fff}
.btn-dark:hover{background:#002b4d}
.btn-gray{background:#607d8b;color:#fff}
.btn-gray:hover{background:#455a64}
.btn-sm{padding:4px 8px;font-size:11px}
.btn-block{width:100%}

.upload-area{position:relative;border:2px dashed #bcd;border-radius:6px;padding:9px;text-align:center;cursor:pointer;background:#f8f9ff;transition:all .2s}
.upload-area:hover{border-color:#0099CC;background:#f0f8ff}
.upload-area input[type=file]{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;border:none;padding:0}
.upload-icon{font-size:15px;margin-bottom:2px}
.upload-text{font-size:11px;color:#667;pointer-events:none}

.logo-preview-wrap{margin-top:10px;display:none;}
.logo-preview-box{display:flex;align-items:center;justify-content:flex-start;background:#fff;border:1px solid #e8e8e8;border-radius:8px;padding:10px 14px;}
#logoPreview{display:block;max-height:44px;max-width:160px;object-fit:contain;}

.hotel-card{background:#f8faff;border:1.5px solid #d0ddf0;border-radius:8px;padding:10px;margin-bottom:8px}
.hotel-card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid #e0e8f8}
.hotel-card-num{font-size:12px;font-weight:700;color:#0099CC}
.hotel-photo-preview{width:100%;max-height:70px;object-fit:cover;border-radius:5px;margin-top:5px;display:none;border:1px solid #ddd}

.recipient-add-row{display:flex;gap:6px;margin-bottom:8px}
.recipient-add-row input{flex:1}
.recipients-list{max-height:130px;overflow-y:auto;border:1px solid #e0e0e0;border-radius:6px;background:#fafafa}
.recipient-item{display:flex;align-items:center;justify-content:space-between;padding:5px 10px;border-bottom:1px solid #eee;font-size:12px}
.recipient-item:last-child{border-bottom:none}

.action-bar{padding:11px 15px;background:#f5f7fa;border-top:2px solid #0099CC;display:flex;gap:7px;flex-wrap:wrap;flex-shrink:0}
.action-bar .btn{flex:1;min-width:80px;padding:9px 6px;font-size:11px}

.send-progress{display:none;padding:7px 15px;background:#e8f5e9;border-top:1px solid #4CAF50;font-size:11px;color:#2e7d32;font-weight:600;flex-shrink:0}
.progress-bar-wrap{height:4px;background:#c8e6c9;border-radius:2px;margin-top:4px;overflow:hidden}
.progress-bar{height:100%;background:#4CAF50;border-radius:2px;transition:width .3s}

.preview-panel{display:flex;flex-direction:column;background:#dde}
.preview-topbar{background:#003D6B;color:#fff;padding:7px 14px;display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:600;flex-shrink:0}
.preview-topbar-right{display:flex;align-items:center;gap:10px;font-size:11px;opacity:.8}
.preview-iframe{flex:1;border:none;width:100%;background:#fff}

.toast{position:fixed;top:64px;right:18px;padding:10px 16px;border-radius:8px;font-size:13px;font-weight:600;color:#fff;z-index:9999;box-shadow:0 4px 16px rgba(0,0,0,.2);max-width:270px;animation:toastIn .3s ease;transition:opacity .3s,transform .3s}
.toast.success{background:#43a047}
.toast.error{background:#e53935}
.toast.info{background:#0099CC}
.toast.warning{background:#fb8c00}
@keyframes toastIn{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:translateX(0)}}

::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:#f0f0f0}
::-webkit-scrollbar-thumb{background:#bbb;border-radius:3px}

@media(max-width:768px){
  body{overflow:auto}
  .main-layout{grid-template-columns:1fr;height:auto}
  .preview-panel{height:480px}
  .form-row{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div class="app-header">
  <div class="app-header-left">
    <span style="font-size:20px">&#9992;&#65039;</span>
    <div>
      <div class="app-title" id="navAgencyName">Drini Travel &amp; Hotels</div>
      <div class="app-subtitle">Gjenerator Emailesh Profesional</div>
    </div>
  </div>
</div>

<div class="main-layout">

  <!-- FORM PANEL -->
  <div class="form-panel">
    <div class="form-body">


      <!-- SETTINGS -->
      <div class="section">
        <div class="section-title">&#9881;&#65039; Cilesimet Pergjithshme</div>
        <div class="form-row">
          <div class="form-group">
            <label>Oferta Badge</label>
            <input type="text" id="offerBadge" oninput="debouncedUpdate()" placeholder="Afer Cmimet Momentale">
          </div>
          <div class="form-group">
            <label>Data</label>
            <input type="date" id="offerDate" oninput="debouncedUpdate()">
          </div>
        </div>
        <div class="form-group">
          <label>Titull Kryesor</label>
          <textarea id="mainTitle" rows="2" oninput="debouncedUpdate()" placeholder="Antalya te pret kete vere"></textarea>
        </div>
        <div class="form-group">
          <label>Nen-titull</label>
          <input type="text" id="subtitle" oninput="debouncedUpdate()" placeholder="4 nete 5 dite">
        </div>
      </div>

      <!-- HERO / LEAD -->
      <div class="section">
        <div class="section-title">&#128247; Foto Kryesore &amp; Cmimi</div>
        <div class="form-group">
          <label>Foto Hero (URL)</label>
          <input type="text" id="heroImageUrl" oninput="handleHeroURL(this.value)">
        </div>
        <div class="form-group">
          <label>ose Upload Foto Hero</label>
          <div class="upload-area"><div class="upload-icon">&#128247;</div>
          <div class="upload-text">Ngarko foto banner...</div>
          <input type="file" accept="image/*" onchange="handleHeroFile(event)"></div>
          <img id="heroPreview" class="hotel-photo-preview" style="display:none">
        </div>
        <div class="form-group">
          <label>Rreshti Kryesor i Cmimit</label>
          <input type="text" id="leadPrice" placeholder="22 hotele All Inclusive nga &euro;459" oninput="debouncedUpdate()">
        </div>
        <div class="form-group">
          <label>Nen-tekst (fluturim / transfer)</label>
          <input type="text" id="leadSubtext" placeholder="Fluturim nga Prishtina &middot; 7 dite &middot; transfer aeroport-hotel perfshire" oninput="debouncedUpdate()">
        </div>
      </div>

      <!-- HOTELS -->
      <div class="section">
        <div class="section-title">&#127968; Detajet e Hoteleve</div>
        <div id="hotelsContainer"></div>
        <button class="btn btn-primary btn-block" onclick="addHotel()" style="margin-top:6px">+ Shto Hotel Tjeter</button>
      </div>



    </div>

    <div class="action-bar">
      <button class="btn btn-dark"    onclick="downloadPDF()">&#11015;&#65039; Shkarko PDF</button>
      <button class="btn btn-primary" onclick="openPreview()">&#128065;&#65039; Shiko si Email</button>
      <button class="btn btn-success" onclick="kopjoDizajnin()">&#128203; Kopjo</button>
    </div>
  </div>

  <!-- PREVIEW PANEL -->
  <div class="preview-panel">
    <div class="preview-topbar">
      <span>&#128065;&#65039; Live Preview &mdash; Email Template</span>
      <div class="preview-topbar-right">
        <span id="hotelCountBadge">0 hotele</span>
      </div>
    </div>
    <iframe id="previewFrame" class="preview-iframe" title="Email Preview"></iframe>
  </div>

</div>


<script>
var hotels = [];
var recipients = [];
var heroImage = null;
var COPY_MODE = false;
var CLOUDINARY_CLOUD_NAME = 'tqw6ippx';
var CLOUDINARY_UPLOAD_PRESET = 'drinioffers';
var cloudinaryCache = {};
var logoImage = 'https://res.cloudinary.com/tqw6ippx/image/upload/v1785429765/gvkis9nvp6bp5ev8imy3.png';
var hotelIdCounter = 0;
var previewTimer = null;

window.addEventListener('load', function() {
  var loaded = loadFromStorage();
  if (!loaded) addHotel();
  updatePreview();
});

function debouncedUpdate() {
  clearTimeout(previewTimer);
  previewTimer = setTimeout(function(){ saveToStorage(); updatePreview(); }, 180);
}

function saveToStorage() {
  var data = {
    offerBadge:      gv('offerBadge'),
    offerDate:       gv('offerDate'),
    mainTitle:       gv('mainTitle'),
    tagLabel:        gv('tagLabel'),
    subtitle:        gv('subtitle'),
    leadPrice:       gv('leadPrice'),
    leadSubtext:     gv('leadSubtext'),
    heroImage:       heroImage,
  };
  try { localStorage.setItem('drini_data', JSON.stringify(data)); } catch(e){}
}

function loadFromStorage() {
  try {
    var raw = localStorage.getItem('drini_data');
    if (!raw) return false;
    var d = JSON.parse(raw);
    var set = function(id, val){ var el = document.getElementById(id); if(el && val) el.value = val; };
    set('offerBadge',      d.offerBadge);
    set('offerDate',       d.offerDate);
    set('mainTitle',       d.mainTitle);
    set('subtitle',        d.subtitle);
    set('leadPrice',       d.leadPrice);
    set('leadSubtext',     d.leadSubtext);
    if (d.heroImage) {
      heroImage = d.heroImage;
      var img = document.getElementById('heroPreview');
      if (img) { img.src = heroImage; img.style.display = 'block'; }
      if (heroImage.indexOf('data:') !== 0) set('heroImageUrl', heroImage);
    }
    addHotel();
    return true;
  } catch(e) { return false; }
}

function compressImageDataURL(dataUrl, maxWidth, quality, callback) {
  var img = new Image();
  img.onload = function() {
    var scale = Math.min(1, maxWidth / img.width);
    var w = Math.max(1, Math.round(img.width * scale));
    var h = Math.max(1, Math.round(img.height * scale));
    var canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    var ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0, w, h);
    var out;
    try { out = canvas.toDataURL('image/jpeg', quality); } catch (e) { out = dataUrl; }
    callback(out);
  };
  img.onerror = function() { callback(dataUrl); };
  img.src = dataUrl;
}

function handleHeroFile(e) {
  var file = e.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(ev) {
    compressImageDataURL(ev.target.result, 1200, 0.75, function(compressed) {
      heroImage = compressed;
      var img = document.getElementById('heroPreview');
      if (img) { img.src = heroImage; img.style.display = 'block'; }
      var urlInp = document.getElementById('heroImageUrl');
      if (urlInp) urlInp.value = '';
      saveToStorage(); updatePreview();
      toast('Duke ngarkuar foton...', 'info');
      uploadToCloudinary(compressed).then(function(url) {
        heroImage = url;
        if (img) img.src = url;
        saveToStorage(); updatePreview();
        toast('&#10003; Foto e ngarkuar', 'success');
      }).catch(function() {
        toast('Ngarkimi i fotos deshtoi, provo perseri', 'error');
      });
    });
  };
  reader.readAsDataURL(file);
}
function handleHeroURL(url) {
  heroImage = url.trim() || null;
  var img = document.getElementById('heroPreview');
  if (img) {
    if (heroImage) { img.src = heroImage; img.style.display = 'block'; }
    else { img.style.display = 'none'; }
  }
  debouncedUpdate();
}




// HOTELS
function addHotel() {
  hotels.push({ id: ++hotelIdCounter, name:'', location:'', type:'', price:'€', image:null, roomType:'', stars:'', link:'', inclFluturimi:false, inclTransferi:false, priceLabel:'' });
  renderHotels();
  saveToStorage(); updatePreview();
}
function removeHotel(id) {
  if (hotels.length <= 1) { toast('Duhet te pakten 1 hotel!', 'error'); return; }
  hotels = hotels.filter(function(h){ return h.id !== id; });
  renderHotels();
  saveToStorage(); updatePreview();
}
function setHotelField(id, field, value) {
  var h = hotels.find(function(h){ return h.id === id; });
  if (h) { h[field] = value; debouncedUpdate(); }
}
function updateInclTypeLabel(id, type) {
  var el = document.getElementById('inclType_' + id);
  if (el) el.textContent = type || '';
}
function handleHotelFile(id, e) {
  var file = e.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(ev) {
    compressImageDataURL(ev.target.result, 900, 0.75, function(compressed) {
      var h = hotels.find(function(h){ return h.id === id; });
      if (!h) return;
      h.image = compressed;
      var img = document.getElementById('hp_' + id);
      if (img) { img.src = h.image; img.style.display = 'block'; }
      var urlInp = document.getElementById('hurl_' + id);
      if (urlInp) urlInp.value = '';
      saveToStorage(); updatePreview();
      toast('Duke ngarkuar foton...', 'info');
      uploadToCloudinary(compressed).then(function(url) {
        var h2 = hotels.find(function(h){ return h.id === id; });
        if (h2) h2.image = url;
        if (img) img.src = url;
        saveToStorage(); updatePreview();
        toast('&#10003; Foto e ngarkuar', 'success');
      }).catch(function() {
        toast('Ngarkimi i fotos deshtoi, provo perseri', 'error');
      });
    });
  };
  reader.readAsDataURL(file);
}
function handleHotelURL(id, url) {
  var h = hotels.find(function(h){ return h.id === id; });
  if (!h) return;
  h.image = url.trim() || null;
  var img = document.getElementById('hp_' + id);
  if (img) {
    if (h.image) { img.src = h.image; img.style.display = 'block'; }
    else { img.style.display = 'none'; }
  }
  debouncedUpdate();
}
function renderHotels() {
  var c = document.getElementById('hotelsContainer');
  c.innerHTML = hotels.map(function(h, i) {
    var urlVal = (h.image && h.image.indexOf('data:') !== 0) ? esc(h.image) : '';
    var imgSrc = h.image || '';
    var imgDisp = h.image ? 'block' : 'none';
    return '<div class="hotel-card" id="hc_' + h.id + '">'
      + '<div class="hotel-card-header">'
      + '<span class="hotel-card-num">&#127968; Hotel ' + (i+1) + '</span>'
      + '<button class="btn btn-danger btn-sm" onclick="removeHotel(' + h.id + ')">&#10005; Fshij</button>'
      + '</div>'
      + '<div class="form-group"><label>Emri i Hotelit</label>'
      + '<input type="text" value="' + esc(h.name) + '" oninput="setHotelField(' + h.id + ',\'name\',this.value)"></div>'
      + '<div class="form-row">'
      + '<div class="form-group"><label>Vendndodhja &amp; Kohegjatja</label>'
      + '<input type="text" value="' + esc(h.location) + '" oninput="setHotelField(' + h.id + ',\'location\',this.value)"></div>'
      + '<div class="form-group"><label>Lloji Akomodimit</label>'
      + '<select onchange="setHotelField(' + h.id + ',\'type\',this.value); updateInclTypeLabel(' + h.id + ',this.value)">'
      + ['', 'No Meals', 'Bed And Breakfast', 'Half Board', 'All Inclusive', 'Ultra All Inclusive'].map(function(opt){
          return '<option value="' + opt + '"' + (h.type === opt ? ' selected' : '') + '>' + (opt || '— Zgjidh —') + '</option>';
        }).join('')
      + '</select></div>'
      + '</div>'
      + '<div class="form-row">'
      + '<div class="form-group"><label>Lloji i Dhomes</label>'
      + '<input type="text" value="' + esc(h.roomType) + '" oninput="setHotelField(' + h.id + ',\'roomType\',this.value)"></div>'
      + '<div class="form-group"><label>Yje</label>'
      + '<select onchange="setHotelField(' + h.id + ',\'stars\',this.value)">'
      + ['', '1', '2', '3', '4', '5'].map(function(opt){
          return '<option value="' + opt + '"' + (String(h.stars||'') === opt ? ' selected' : '') + '>' + (opt || '— Zgjidh —') + '</option>';
        }).join('')
      + '</select></div>'
      + '</div>'
      + '<div class="form-group"><label>Cmimi</label>'
      + '<input type="text" value="' + esc(h.price) + '" oninput="setHotelField(' + h.id + ',\'price\',this.value)"></div>'
      + '<div class="form-group"><label>Teksti nen Cmim (p.sh. Per Person)</label>'
      + '<input type="text" value="' + esc(h.priceLabel) + '" placeholder="Per Person" oninput="setHotelField(' + h.id + ',\'priceLabel\',this.value)"></div>'
      + '<div class="form-group"><label>Linku (Me Shume)</label>'
      + '<input type="text" value="' + esc(h.link) + '" oninput="setHotelField(' + h.id + ',\'link\',this.value)"></div>'
      + '<div class="form-group"><label>Perfshirjet mbi foto (<span id="inclType_' + h.id + '">' + esc(h.type || '') + '</span> shfaqet gjithmone)</label>'
      + '<label style="display:inline-flex;align-items:center;gap:5px;text-transform:none;font-weight:normal;margin-right:14px;">'
      + '<input type="checkbox" style="width:auto;" ' + (h.inclFluturimi === true ? 'checked' : '') + ' onchange="setHotelField(' + h.id + ',\'inclFluturimi\',this.checked)"> Fluturimi</label>'
      + '<label style="display:inline-flex;align-items:center;gap:5px;text-transform:none;font-weight:normal;">'
      + '<input type="checkbox" style="width:auto;" ' + (h.inclTransferi === true ? 'checked' : '') + ' onchange="setHotelField(' + h.id + ',\'inclTransferi\',this.checked)"> Transferi</label>'
      + '</div>'
      + '<div class="form-group"><label>Foto URL</label>'
      + '<input type="text" id="hurl_' + h.id + '" value="' + urlVal + '" oninput="handleHotelURL(' + h.id + ',this.value)"></div>'
      + '<div class="form-group"><label>ose Upload Foto</label>'
      + '<div class="upload-area"><div class="upload-icon">&#128247;</div>'
      + '<div class="upload-text">Ngarko fotografi...</div>'
      + '<input type="file" accept="image/*" onchange="handleHotelFile(' + h.id + ',event)"></div>'
      + '<img id="hp_' + h.id + '" class="hotel-photo-preview" src="' + imgSrc + '" style="display:' + imgDisp + '">'
      + '</div></div>';
  }).join('');
  document.getElementById('hotelCountBadge').textContent = hotels.length + ' hotele';
}


// EMAIL HTML GENERATOR
function gv(id) {
  var el = document.getElementById(id);
  return el ? (el.value || '') : '';
}

function buildEmailCoreTable() {
  var mainTitle      = gv('mainTitle');
  var subtitle       = gv('subtitle');
  var leadPrice      = gv('leadPrice');
  var leadSubtext    = gv('leadSubtext');
  var cPhone = '+38348166151 / +38348166152';
  var cEmail = 'info@drinihotels.com';
  var waNum  = '38348166151';
  var titleHTML  = mainTitle.replace(/\n/g,'<br>');

var headerInner = logoImage
    ? '<img src="' + logoImage + '" alt="Logo" style="display:block;height:80px;width:auto;object-fit:contain;">'
    : '<div style="font-family:Arial,sans-serif;font-size:11px;color:#bbb;font-style:italic;">[ logo ]</div>';

  var monthNames = ['Janar','Shkurt','Mars','Prill','Maj','Qershor','Korrik','Gusht','Shtator','Tetor','Nentor','Dhjetor'];
  var offerBadge = gv('offerBadge');
  var rawDate    = gv('offerDate');
  var dp = rawDate ? rawDate.split('-') : null; // [YYYY, MM, DD]
  var offerDateShort = dp ? (dp[2] + '/' + dp[1]) : '';
  var offerDateLong  = dp ? (parseInt(dp[2],10) + ' ' + monthNames[parseInt(dp[1],10)-1] + ' ' + dp[0]) : '';

  var today = new Date();
var todayLong = today.getDate() + ' ' + monthNames[today.getMonth()] + ' ' + today.getFullYear();
var headerRight = '<div style="font-family:Arial,sans-serif;font-size:15px;color:#999;text-align:right;">Newsletter &middot; ' + todayLong + '</div>';

  var heroRow = heroImage
    ? '<tr><td style="padding:0;"><img src="' + heroImage + '" alt="" width="100%" style="display:block;width:100%;max-height:380px;object-fit:cover;"></td></tr>'

function composeHotelCardFlat(h, inclusionsText) {
  return new Promise(function(resolve) {
    if (!h.image) { resolve(null); return; }
    var photo = new Image();
    photo.crossOrigin = 'anonymous';
    photo.onload = function() {
      var W = 640, H = 390;
      var canvas = document.createElement('canvas');
      canvas.width = W; canvas.height = H;
      var ctx = canvas.getContext('2d');

      var scale = Math.max(W / photo.width, H / photo.height);
      var sw = W / scale, sh = H / scale;
      var sx = (photo.width - sw) / 2, sy = (photo.height - sh) / 2;
      var r = 16;
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(r, 0);
      ctx.lineTo(W - r, 0); ctx.arcTo(W, 0, W, r, r);
      ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.lineTo(0, r); ctx.arcTo(0, 0, r, 0, r);
      ctx.closePath();
      ctx.clip();
      try { ctx.drawImage(photo, sx, sy, sw, sh, 0, 0, W, H); } catch (e) {}
      ctx.restore();

      // toDataURL throws if the canvas got "tainted" by a cross-origin photo
      // URL that doesn't support CORS — never let that hang the whole copy.
      function finish() {
        var out;
        try { out = canvas.toDataURL('image/jpeg', 0.85); } catch (e) { out = h.image; }
        resolve(out);
      }

      if (!(h.name || h.location || h.price)) {
        finish();
        return;
      }
      var overlay = new Image();
      overlay.onload = function() {
        var bandW = (W - 56) * 0.78;
        var bandH = bandW * (overlay.height / overlay.width);
        var bx = (W - bandW) / 2, by = H - bandH - 28;
        try { ctx.drawImage(overlay, bx, by, bandW, bandH); } catch (e) {}
        finish();
      };
      overlay.onerror = finish;
      overlay.src = buildInclBandSVG(h, inclusionsText);
    };
    photo.onerror = function() { resolve(null); };
    photo.src = h.image;
  });
}

function inclusionsTextFor(h) {
  var bits = [];
  if (h.inclFluturimi === true) bits.push('Fluturimi');
  if (h.type) bits.push(h.type);
  if (h.inclTransferi === true) bits.push('Transferi');
  return bits.join(' | ');
}

var _measureCanvas = null;
function measureTextWidth(text, fontSize, fontWeight) {
  if (!_measureCanvas) _measureCanvas = document.createElement('canvas');
  var ctx = _measureCanvas.getContext('2d');
  ctx.font = (fontWeight ? fontWeight + ' ' : '') + fontSize + 'px Arial, Helvetica, sans-serif';
  return ctx.measureText(text).width;
}

// Greedy word-wrap into at most 2 lines; overflow beyond that gets an ellipsis
// so a long hotel name breaks onto a second line instead of running into the price box.
function wrapNameText(text, maxWidth, fontSize, fontWeight) {
  if (!text) return [];
  if (measureTextWidth(text, fontSize, fontWeight) <= maxWidth) return [text];
  var words = text.split(' ');
  var lines = [];
  var current = '';
  var wi = 0;
  while (wi < words.length && lines.length < 2) {
    var test = current ? current + ' ' + words[wi] : words[wi];
    if (!current || measureTextWidth(test, fontSize, fontWeight) <= maxWidth) {
      current = test;
      wi++;
    } else {
      lines.push(current);
      current = '';
    }
  }
  if (lines.length < 2 && current) { lines.push(current); current = ''; }
  if (wi < words.length) {
    var last = lines[1] || '';
    while (last.length > 1 && measureTextWidth(last + '…', fontSize, fontWeight) > maxWidth) {
      last = last.slice(0, -1);
    }
    lines[1] = last.replace(/\s+$/, '') + '…';
  }
  return lines;
}

function buildInclBandSVG(h, inclusionsText) {
  var W = 292, angleDeg = 2.5;
  var whiteW = Math.round(W * 0.68);
  var blueW = W - whiteW;

  var locRaw  = (h.location || '').toUpperCase();
  var nameRaw = (h.name || '').toUpperCase();
  var loc = esc(locRaw);
  var inc = esc(inclusionsText.toUpperCase());
  var price = esc(h.price || '');
  var priceLabel = esc((h.priceLabel || 'Per Person').toUpperCase());

  var nameLines = wrapNameText(nameRaw, whiteW - 16, 11, 'bold').map(esc);
  var extraH = nameLines.length > 1 ? 12 : 0;
  var H = 62 + extraH;

  // The rotated rect's bounding box is bigger than WxH, so give the canvas
  // extra room (+padding) and center the rect in it, or the corners clip.
  var rad = angleDeg * Math.PI / 180;
  var bboxW = Math.ceil(W * Math.cos(rad) + H * Math.sin(rad));
  var bboxH = Math.ceil(W * Math.sin(rad) + H * Math.cos(rad));
  var pad = 6;
  var canvasW = bboxW + pad * 2;
  var canvasH = bboxH + pad * 2;
  var ox = Math.round((canvasW - W) / 2); // rect offset inside canvas
  var oy = Math.round((canvasH - H) / 2);
  var cx = canvasW / 2, cy = canvasH / 2;  // rotation center = canvas center

  var nameY = oy + (loc ? 28 : 20);
  var nameHTML = nameLines.map(function(line, i) {
    return '<text x="' + (ox + 8) + '" y="' + (nameY + i * 11) + '" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="bold" fill="#111111">' + line + '</text>';
  }).join('');

  var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="' + canvasW + '" height="' + canvasH + '" viewBox="0 0 ' + canvasW + ' ' + canvasH + '">'
    + '<g transform="rotate(-' + angleDeg + ' ' + cx + ' ' + cy + ')">'
    + '<rect x="' + ox + '" y="' + oy + '" width="' + whiteW + '" height="' + H + '" rx="7" fill="#ffffff"/>'
    + (h.price ? '<rect x="' + (ox + whiteW) + '" y="' + oy + '" width="' + blueW + '" height="' + H + '" rx="7" fill="#0099CC"/>' : '')
    + (loc ? '<text x="' + (ox + 8) + '" y="' + (oy + 15) + '" font-family="Arial,Helvetica,sans-serif" font-size="8" font-weight="bold" letter-spacing="0.4" fill="#003D6B">' + loc + '</text>' : '')
    + nameHTML
    + '<line x1="' + (ox + 8) + '" y1="' + (oy + 36 + extraH) + '" x2="' + (ox + whiteW - 8) + '" y2="' + (oy + 36 + extraH) + '" stroke="#eeeeee" stroke-width="1"/>'
    + (inc ? '<text x="' + (ox + whiteW / 2) + '" y="' + (oy + 47 + extraH) + '" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="6.5" fill="#888888">' + inc + '</text>' : '')
    + (h.price ? '<text x="' + (ox + whiteW + blueW / 2) + '" y="' + (oy + 14 + extraH / 2) + '" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="7" fill="#ffffff">PREJ</text>' : '')
    + (h.price ? '<text x="' + (ox + whiteW + blueW / 2) + '" y="' + (oy + 34 + extraH / 2) + '" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" fill="#ffffff">' + price + '</text>' : '')
    + (h.price ? '<text x="' + (ox + whiteW + blueW / 2) + '" y="' + (oy + 47 + extraH / 2) + '" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="6" fill="#ffffff">' + priceLabel + '</text>' : '')
    + '</g>'
    + '</svg>';

  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}

// ACTIONS
function withTimeout(promise, ms, fallbackValue) {
  return new Promise(function(resolve) {
    var done = false;
    var timer = setTimeout(function() {
      if (!done) { done = true; resolve(fallbackValue); }
    }, ms);
    promise.then(function(v) {
      if (!done) { done = true; clearTimeout(timer); resolve(v); }
    }).catch(function() {
      if (!done) { done = true; clearTimeout(timer); resolve(fallbackValue); }
    });
  });
}

function uploadToCloudinary(dataUrl) {
  if (!dataUrl || dataUrl.indexOf('data:') !== 0) return Promise.resolve(dataUrl);
  if (cloudinaryCache[dataUrl]) return Promise.resolve(cloudinaryCache[dataUrl]);
  var fd = new FormData();
  fd.append('file', dataUrl);
  fd.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
  return fetch('https://api.cloudinary.com/v1_1/' + CLOUDINARY_CLOUD_NAME + '/image/upload', {
    method: 'POST', body: fd
  }).then(function(r){ return r.json(); }).then(function(json) {
    if (json.secure_url) { cloudinaryCache[dataUrl] = json.secure_url; return json.secure_url; }
    throw new Error((json.error && json.error.message) || 'Upload deshtoi');
  });
}

function uploadAllImagesForCopy() {
  var jobs = [];
  if (heroImage && heroImage.indexOf('data:') === 0) {
    jobs.push(uploadToCloudinary(heroImage).then(function(url) {
      heroImage = url;
      var img = document.getElementById('heroPreview');
      if (img) img.src = heroImage;
    }));
  }
  hotels.forEach(function(h) {
    if (h.image && h.image.indexOf('data:') === 0) {
      jobs.push(uploadToCloudinary(h.image).then(function(url) {
        h.image = url;
        var img = document.getElementById('hp_' + h.id);
        if (img) img.src = h.image;
      }));
    }
  });
  return Promise.all(jobs);
}

function finishKopjoDizajnin() {
  COPY_MODE = true;
  var coreHTML = buildEmailCoreTable();

 var html = '<table width="100%" cellpadding="0" cellspacing="0" border="0" role="presentation">'
    + '<tr><td align="center">'
    + coreHTML
    + '</td></tr></table>';

  var container = document.createElement('div');

  container.style.cssText = 'position:fixed;left:-9999px;top:0;white-space:normal;';
  container.innerHTML = html;
  document.body.appendChild(container);

  var range = document.createRange();
  range.selectNodeContents(container);
  var sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);

  var copied = false;
  try { copied = document.execCommand('copy'); } catch (e) { copied = false; }

  sel.removeAllRanges();
  document.body.removeChild(container);

  if (copied) {
    toast('&#10003; Dizajni u kopjua! Shko te Gmail dhe bej Ctrl+V', 'success');
  } else if (window.ClipboardItem && navigator.clipboard && navigator.clipboard.write) {
    var blob = new Blob([html], {type:'text/html'});
    navigator.clipboard.write([new ClipboardItem({'text/html':blob})])
      .then(function(){ toast('&#10003; Dizajni u kopjua! Shko te Gmail dhe bej Ctrl+V','success'); })
      .catch(function(){ fallbackKopjo(html); });
  } else {
    fallbackKopjo(html);
  }
}

function fallbackKopjo(html) {
  var ta = document.createElement('textarea');
  ta.value = html; ta.style.cssText = 'position:fixed;opacity:0';
  document.body.appendChild(ta); ta.focus(); ta.select();
  document.execCommand('copy'); document.body.removeChild(ta);
  toast('&#10003; Dizajni u kopjua! Shko te Gmail dhe bej Ctrl+V','success');
}

function openPreview() {
  var html = generateEmailHTML();
  var win = window.open('', '_blank');
  if (!win) { toast('Lejo pop-up nga browser-i!', 'error'); return; }
  win.document.open();
  win.document.write(html);
  win.document.close();
}

function downloadPDF() {
  var html = generateEmailHTML();
  var printCSS = '<style>'
    + '*{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;color-adjust:exact!important}'
    + '@page{margin:0;size:A4}'
    + 'body{margin:0;padding:20px 0;background:#f0f2f5!important}'
    + '</style>';
  var printHTML = html.replace('</head>', printCSS + '</head>');
  var win = window.open('', '_blank');
  if (!win) { toast('Lejo pop-up nga browser-i!', 'error'); return; }
  win.document.open();
  win.document.write(printHTML);
  win.document.close();
  win.onload = function() {
    setTimeout(function() {
      win.focus();
      win.print();
    }, 800);
  };
}

// TOAST
function toast(msg, type) {
  document.querySelectorAll('.toast').forEach(function(t){ t.remove(); });
  var el = document.createElement('div');
  el.className = 'toast ' + (type || 'info');
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(function(){
    el.style.opacity = '0';
    el.style.transform = 'translateX(60px)';
    setTimeout(function(){ el.remove(); }, 300);
  }, 3500);
}

// UTILS
function esc(s) {
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
